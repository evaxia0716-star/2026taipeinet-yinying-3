<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台北有影 3｜名單總管</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f0faf8; --surface: #ffffff; --surface2: #e6f5f2;
    --border: #c8e6e0; --border2: #a8d5cc;
    --accent: #0d9488; --accent-hover: #0f766e;
    --text: #1a3330; --text-dim: #3d5c57; --text-muted: #5f8a84;
    --danger: #dc2626; --warn: #d97706; --success: #059669;
    --row-h: 36px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 15px; }
  body { font-family: "Noto Sans TC", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  header {
    position: sticky; top: 0; z-index: 100;
    background: #134e4a; padding: 0 1.5rem;
    display: flex; align-items: center; justify-content: space-between;
    height: 56px;
    box-shadow: 0 2px 12px rgba(13,74,70,0.25);
  }
  .header-left { display: flex; align-items: center; gap: 1rem; }
  .logo { font-family: "IBM Plex Mono", monospace; font-size: 0.68rem; letter-spacing: 0.18em; color: #5eead4; text-transform: uppercase; }
  .project-title { font-size: 1rem; font-weight: 700; color: #fff; }
  .project-title .sub { color: #99f6e4; font-size: 0.85rem; font-weight: 400; margin-left: 0.4rem; }
  .header-right { display: flex; align-items: center; gap: 0.4rem; }
  .btn {
    display: inline-flex; align-items: center; gap: 0.3rem;
    padding: 0.38rem 0.85rem; border-radius: 7px;
    border: 1px solid rgba(255,255,255,0.22);
    background: rgba(255,255,255,0.12); color: #e0fdf4;
    font-family: "Noto Sans TC", sans-serif; font-size: 0.82rem;
    cursor: pointer; transition: all 0.15s; text-decoration: none;
    white-space: nowrap;
  }
  .btn:hover { background: rgba(255,255,255,0.24); color: #fff; }
  .btn-accent {
    background: #0d9488; border-color: #0d9488; color: #fff;
    font-weight: 700; box-shadow: 0 2px 6px rgba(13,148,136,0.4);
  }
  .btn-accent:hover { background: #0f766e; }
  .btn-accent:disabled { opacity: .55; cursor: not-allowed; }
  .tabs-bar {
    background: #fff; border-bottom: 2px solid var(--border);
    padding: 0 1.5rem; display: flex; align-items: flex-end; gap: 0; overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs-bar::-webkit-scrollbar { display: none; }
  .tab {
    padding: 0.55rem 1rem 0.5rem; font-size: 0.82rem; font-weight: 600;
    color: var(--text-muted); cursor: pointer;
    border-bottom: 3px solid transparent; margin-bottom: -2px;
    transition: all 0.15s; white-space: nowrap; user-select: none;
  }
  .tab:hover { color: var(--accent); }
  .tab.active { color: var(--text); border-bottom-color: var(--tab-color, var(--accent)); }
  .tab .cnt {
    display: inline-block; font-family: "IBM Plex Mono", monospace;
    font-size: 0.68rem; font-weight: 700; padding: 0.04rem 0.38rem;
    border-radius: 20px; margin-left: 0.35rem;
    background: var(--surface2); color: var(--text-muted);
  }
  .tab.active .cnt { background: var(--tab-color, var(--accent)); color: #fff; }
  .toolbar {
    background: #fff; border-bottom: 1px solid var(--border);
    padding: 0.45rem 1.5rem; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
  }
  .search-wrap { position: relative; }
  .search-input {
    background: var(--bg); border: 1.5px solid var(--border2);
    border-radius: 7px; padding: 0.36rem 0.75rem 0.36rem 1.9rem;
    color: var(--text); font-family: "Noto Sans TC", sans-serif;
    font-size: 0.84rem; width: 180px; outline: none; transition: all 0.15s;
  }
  .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(13,148,136,0.1); }
  .search-input::placeholder { color: var(--text-muted); }
  .search-icon { position: absolute; left: 0.55rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.78rem; pointer-events: none; }
  .row-count { font-family: "IBM Plex Mono", monospace; font-size: 0.78rem; color: var(--text-muted); margin-left: auto; }
  .add-btn {
    display: inline-flex; align-items: center; gap: 0.35rem;
    padding: 0.38rem 0.95rem; border-radius: 7px;
    background: var(--accent); border: none; color: #fff;
    font-family: "Noto Sans TC", sans-serif; font-size: 0.84rem; font-weight: 700;
    cursor: pointer; transition: all 0.15s; box-shadow: 0 2px 6px rgba(13,148,136,0.3);
    white-space: nowrap;
  }
  .add-btn:hover { background: var(--accent-hover); }
  .school-hint {
    display: inline-flex; align-items: center; gap: 0.3rem;
    padding: 0.3rem 0.7rem; border-radius: 7px;
    border: 1.5px solid #a8d5cc; background: #e6f5f2;
    color: var(--text-muted); font-size: 0.76rem;
    white-space: nowrap;
  }
  /* 篩選器（培訓學員的電訪模式／徵件作品的審查模式共用樣式） */
  .training-filters { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
  .tf-label { font-size: 0.78rem; color: var(--text-muted); font-weight: 600; }
  .training-filters select {
    background: var(--bg); border: 1.5px solid var(--border2); border-radius: 7px;
    padding: 0.32rem 0.6rem; font-family: "Noto Sans TC", sans-serif; font-size: 0.82rem;
    color: var(--text); outline: none; cursor: pointer; max-width: 180px;
  }
  .training-filters select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(13,148,136,0.1); }
  .tf-toggle {
    display: inline-flex; align-items: center; gap: 0.35rem;
    padding: 0.32rem 0.6rem; border: 1.5px solid var(--border2); border-radius: 7px;
    background: var(--bg); color: var(--text-dim); font-size: 0.8rem; cursor: pointer; user-select: none;
    white-space: nowrap;
  }
  .tf-toggle input { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }
  .tf-toggle.on { border-color: var(--accent); color: var(--accent); background: #e6f5f2; font-weight: 700; }
  main { padding: 0.8rem 1.5rem 5rem; }
  .table-wrap {
    overflow-x: auto; border: 1.5px solid var(--border);
    border-radius: 10px; background: #fff;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    scrollbar-color: var(--border2) transparent;
  }
  .table-wrap::-webkit-scrollbar { height: 6px; }
  .table-wrap::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
  table {
    border-collapse: collapse; font-size: 0.84rem;
    table-layout: fixed;
    width: max-content; min-width: 100%;
  }
  .tw-inner { width: max-content; min-width: 100%; }
  .table-wrap.auto-width table { table-layout: auto; }
  .table-wrap.auto-width td { height: auto; }
  .table-wrap.auto-width td input,
  .table-wrap.auto-width td select {
    white-space: normal; word-break: break-word;
    min-width: 60px;
  }
  .table-wrap.auto-width td { max-width: 320px; }
  .table-wrap.auto-width .ro-display,
  .table-wrap.auto-width td input,
  .table-wrap.auto-width td select { overflow-wrap: anywhere; }
  thead th {
    padding: 0.55rem 0.75rem; text-align: left;
    font-size: 0.7rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
    color: var(--text-dim); background: var(--surface2);
    border-bottom: 1.5px solid var(--border);
    white-space: nowrap; position: sticky; top: 0; z-index: 2;
  }
  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #f0fdf8; }
  tbody td {
    padding: 0;
    vertical-align: middle;
    height: var(--row-h);
  }
  col.col-num      { width: 32px; }
  col.col-id       { width: 38px; }
  col.col-tiny     { width: 52px; }
  col.col-tag      { width: 78px; }
  col.col-cat      { width: 100px; }
  col.col-role     { width: 80px; }
  col.col-code     { width: 90px; }
  col.col-status   { width: 90px; }
  col.col-amount   { width: 90px; }
  col.col-date     { width: 132px; }
  col.col-datetime { width: 130px; }
  col.col-tel      { width: 110px; }
  col.col-contact  { width: 100px; }
  col.col-name-s   { width: 80px; }
  col.col-email    { width: 150px; }
  col.col-desc     { width: 140px; }
  col.col-org      { width: 160px; }
  col.col-note     { width: 220px; }
  col.col-edu      { width: 80px; }
  col.col-name     { width: 200px; }
  col.col-ownership{ width: 68px; }
  col.col-district { width: 68px; }
  col.col-zip      { width: 66px; }
  col.col-addr     { width: 230px; }
  col.col-track    { width: 88px; }
  col.col-action   { width: 32px; }
  col.col-default  { width: 110px; }
  col.col-long     { width: 200px; }
  col.col-doc      { width: 96px; }   /* ★ v24 文件連結欄（影片、身分證、學生證明…） */
  col.col-miss     { width: 150px; }  /* ★ v24 缺件項目欄 */
  td input, td select {
    background: transparent; border: 1.5px solid transparent;
    color: var(--text); font-family: "Noto Sans TC", sans-serif;
    font-size: 0.82rem; padding: 0.28rem 0.55rem;
    border-radius: 4px; width: 100%; height: 100%; min-height: var(--row-h);
    transition: border-color 0.15s, background 0.15s; outline: none;
    white-space: normal; word-break: break-all;
    line-height: 1.45;
  }
  td input:hover, td select:hover { border-color: var(--border2); background: var(--bg); }
  td input:focus, td select:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 2px rgba(13,148,136,0.12); }
  td.addr-cell { height: auto; padding: 0; vertical-align: top; }
  td.addr-cell .addr-edit {
    display: block;
    width: 100%; min-height: var(--row-h);
    padding: 0.28rem 0.55rem;
    font-family: "Noto Sans TC", sans-serif; font-size: 0.82rem;
    line-height: 1.55; color: var(--text);
    white-space: pre-wrap; word-break: break-all;
    border: 1.5px solid transparent; border-radius: 4px;
    outline: none; cursor: text;
    transition: border-color 0.15s, background 0.15s;
    box-sizing: border-box;
  }
  td.addr-cell .addr-edit:hover { border-color: var(--border2); background: var(--bg); }
  td.addr-cell .addr-edit:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 2px rgba(13,148,136,0.12); }
  td.readonly-cell { height: auto; vertical-align: top; padding: 0; background: #fafcfb; }
  td.readonly-cell .ro-display {
    display: block;
    width: 100%; min-height: var(--row-h);
    padding: 0.32rem 0.55rem;
    font-family: "Noto Sans TC", sans-serif; font-size: 0.82rem;
    line-height: 1.5; color: var(--text-dim);
    white-space: pre-wrap; word-break: break-all;
    border: 1.5px solid transparent; border-radius: 4px;
    cursor: default; box-sizing: border-box;
  }
  td.readonly-cell .ro-display.empty {
    color: var(--text-muted); font-style: italic; font-size: 0.76rem;
  }
  td .ro-display {
    display: block; width: 100%; min-height: var(--row-h);
    padding: 0.32rem 0.55rem; font-size: 0.82rem; line-height: 1.5;
    color: var(--text-dim); box-sizing: border-box; cursor: default;
  }
  .minor-flag {
    display: inline-block; margin-left: 0.3rem;
    font-size: 0.66rem; font-weight: 700; color: #fff;
    background: var(--danger); border-radius: 4px;
    padding: 0.05rem 0.32rem; vertical-align: middle;
    white-space: nowrap;
  }
  /* ★ v24 徵件審查：Drive 文件連結變成可點的按鈕（審查一定要點得開） */
  .doc-link {
    display: inline-flex; align-items: center; gap: 0.22rem;
    margin: 2px; padding: 0.2rem 0.5rem;
    border-radius: 5px; background: #ede9fe; color: #5b21b6;
    border: 1px solid #c4b5fd;
    font-size: 0.75rem; font-weight: 700; text-decoration: none;
    white-space: nowrap; transition: all 0.15s;
  }
  .doc-link:hover { background: #ddd6fe; color: #4c1d95; }
  .doc-link.video { background: #fce7f3; color: #9d174d; border-color: #f9a8d4; }
  .doc-link.video:hover { background: #fbcfe8; }
  .doc-none { color: var(--text-muted); font-size: 0.74rem; font-style: italic; }
  /* ★ v24 缺件標籤 */
  .miss-tag {
    display: inline-block; margin: 1px 2px 1px 0;
    padding: 0.08rem 0.42rem; border-radius: 4px;
    background: #fef2f2; color: var(--danger); border: 1px solid #fca5a5;
    font-size: 0.7rem; font-weight: 700; white-space: nowrap;
  }
  .miss-ok { color: var(--success); font-size: 0.76rem; font-weight: 700; }
  /* ★ v24 審查狀態列底色：一眼看出哪幾件還沒處理 */
  tbody tr.row-pending { background: #fffdf5; }
  tbody tr.row-pending:hover { background: #fef9e7; }
  tbody tr.row-incomplete { background: #fff7f7; }
  tbody tr.row-incomplete:hover { background: #fdeaea; }
  .confirm-box { display:flex; align-items:center; justify-content:center; gap:0.3rem; height:100%; min-height:var(--row-h); cursor:pointer; user-select:none; }
  .confirm-box input { width:17px; height:17px; accent-color:var(--success); cursor:pointer; flex-shrink:0; }
  .confirm-box span { font-size:0.76rem; color:var(--text-muted); }
  .confirm-box input:checked ~ span { color:var(--success); font-weight:700; }
  .td-num { width: 32px; text-align: center; color: var(--text-muted); font-family: "IBM Plex Mono", monospace; font-size: 0.72rem; padding: 0 4px; }
  .td-action { width: 32px; text-align: center; }
  .del-btn {
    width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
    border-radius: 4px; border: 1px solid transparent;
    background: transparent; color: var(--text-muted);
    cursor: pointer; font-size: 0.75rem; transition: all 0.15s; margin: auto;
  }
  .del-btn:hover { border-color: #fca5a5; color: var(--danger); background: #fef2f2; }
  tr:not(:hover) .del-btn { opacity: 0; }
  tr:hover .del-btn { opacity: 1; }
  .amount-cell { text-align: right; font-family: "IBM Plex Mono", monospace; font-weight: 600; }
  .amount-cell input { text-align: right; }
  td input.date-input { font-family: "IBM Plex Mono", monospace; letter-spacing: 0.02em; }
  .sum-bar {
    background: #f0fdf8; border-top: 2px solid var(--border);
    padding: 0.5rem 1rem; display: flex; align-items: center; gap: 1.2rem;
    font-size: 0.84rem; flex-wrap: wrap; border-radius: 0 0 10px 10px;
  }
  .sum-item { display: flex; align-items: center; gap: 0.35rem; }
  .sum-label { color: var(--text-muted); font-weight: 600; }
  .sum-val { font-family: "IBM Plex Mono", monospace; font-weight: 700; color: var(--text); }
  .sum-val.total { color: var(--accent); font-size: 1rem; }
  .source-bar {
    background: #f0fdf8; border-top: 1px solid var(--border);
    padding: 0.4rem 1rem; font-size: 0.76rem; color: var(--text-muted);
    border-radius: 0 0 10px 10px;
  }
  .empty-state { text-align: center; padding: 3rem 0; color: var(--text-muted); }
  .empty-icon { font-size: 2.2rem; margin-bottom: 0.6rem; }
  .loading {
    display: flex; align-items: center; justify-content: center;
    height: 140px; color: var(--text-muted); gap: 0.7rem; font-size: 0.86rem;
  }
  .spinner {
    width: 16px; height: 16px; border: 2px solid var(--border2);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sync-bar {
    background: var(--surface2); border-bottom: 1px solid var(--border);
    padding: 0.32rem 1.5rem; display: flex; align-items: center; gap: 0.8rem;
    font-size: 0.78rem; color: var(--text-muted);
  }
  .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border2); flex-shrink: 0; }
  .sync-dot.ok  { background: var(--success); }
  .sync-dot.err { background: var(--danger); }
  .budget-bar {
    background: #fff; border-bottom: 2px solid var(--border);
    padding: 0.55rem 1.5rem 0.65rem;
  }
  .budget-row { display: flex; align-items: center; gap: 0.9rem; flex-wrap: wrap; }
  .budget-label { font-size: 0.84rem; font-weight: 700; color: var(--text-dim); white-space: nowrap; }
  .budget-slider {
    flex: 1; min-width: 150px; max-width: 360px;
    accent-color: var(--accent); height: 20px; cursor: pointer;
  }
  .budget-amount {
    font-family: "IBM Plex Mono", monospace; font-weight: 700;
    font-size: 1rem; color: var(--accent); white-space: nowrap;
  }
  .budget-stats { display: flex; gap: 1.1rem; margin-left: auto; flex-wrap: wrap; align-items: baseline; }
  .budget-stat { display: flex; align-items: baseline; gap: 0.3rem; white-space: nowrap; }
  .budget-stat .k { font-size: 0.74rem; color: var(--text-muted); font-weight: 600; }
  .budget-stat .v { font-family: "IBM Plex Mono", monospace; font-weight: 700; font-size: 0.9rem; }
  .budget-meter {
    margin-top: 0.45rem; height: 9px; border-radius: 5px;
    background: var(--surface2); overflow: hidden;
  }
  .budget-fill {
    height: 100%; border-radius: 5px; background: var(--accent);
    width: 0%; transition: width 0.3s, background 0.3s;
  }
  .sheet-color-bar { height: 3px; background: var(--tab-color, var(--accent)); transition: background 0.2s; }
  .toast {
    position: fixed; bottom: 1.5rem; right: 1.5rem;
    background: #134e4a; color: #fff; border-radius: 8px;
    padding: 0.75rem 1.2rem; font-size: 0.88rem; z-index: 2000;
    transform: translateX(130%); transition: transform 0.25s;
    box-shadow: 0 4px 16px rgba(13,74,70,0.3);
  }
  .toast.show { transform: translateX(0); }
  .toast.err  { background: #7f1d1d; }
  .table-wrap.full-view th.sticky-col,
  .table-wrap.full-view td.sticky-col {
    position: sticky; left: 0; z-index: 1;
    background: #fff;
    box-shadow: 2px 0 6px rgba(13,74,70,0.08);
  }
  .table-wrap.full-view thead th.sticky-col {
    background: var(--surface2); z-index: 3;
  }
  .table-wrap.full-view tbody tr:hover td.sticky-col { background: #f0fdf8; }
  @media (max-width: 1200px) {
    main { padding: 0.6rem 1rem 4rem; }
    header, .tabs-bar, .toolbar, .sync-bar, .budget-bar { padding-left: 1rem; padding-right: 1rem; }
  }
</style>
</head>
<body>
<header>
  <div class="header-left">
    <div class="logo">PAC · 公用頻道 · v26</div>
    <div class="project-title">台北有影 3<span class="sub">名單總管</span></div>
  </div>
  <div class="header-right">
    <span id="syncLabel" style="font-family:'IBM Plex Mono',monospace;font-size:0.73rem;color:#5eead4">尚未同步</span>
    <button class="btn" onclick="loadCurrentSheet()">↻ 重整</button>
    <a class="btn" href="./" target="_self">☰ 進度</a>
    <button class="btn btn-accent" id="saveBtn" onclick="saveCurrentSheet()">✓ 儲存</button>
  </div>
</header>
<div class="sheet-color-bar" id="colorBar"></div>
<div class="sync-bar">
  <div class="sync-dot" id="syncDot"></div>
  <span id="syncText">連線中…</span>
  <span style="margin-left:auto;font-family:'IBM Plex Mono',monospace" id="rowInfo"></span>
</div>
<div class="budget-bar" id="budgetBar">
  <div class="budget-row">
    <span class="budget-label">💰 專案預算</span>
    <input type="range" class="budget-slider" id="budgetSlider"
      min="0" max="2000000" step="10000" value="1000000"
      oninput="onBudgetSlide(this.value)" onchange="saveBudget(this.value)"
      title="拖動調整總預算（上限 200 萬，1 萬一格）；放開後自動儲存（同事看到的是同一個數字）">
    <span class="budget-amount" id="budgetAmount">NT$ 1,000,000</span>
    <div class="budget-stats" id="budgetStats"></div>
  </div>
  <div class="budget-meter"><div class="budget-fill" id="budgetFill"></div></div>
</div>
<div class="tabs-bar" id="tabsBar"></div>
<div class="toolbar" id="toolbar">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" type="text" id="searchInput" placeholder="搜尋此名單…" oninput="renderTable()">
  </div>
  <span id="trainingFilters" class="training-filters" style="display:none"></span>
  <button class="add-btn" id="addRowBtn" onclick="addRow()">＋ 新增</button>
  <button class="add-btn" id="toWinnerBtn" onclick="convertToWinners()"
          style="display:none;background:#b45309;box-shadow:0 2px 6px rgba(180,83,9,0.3)"
          title="把「擬獲獎項」有填的作品，自動建立到「得獎者」名單">🏆 轉入得獎者</button>
  <span class="row-count" id="rowCount"></span>

const awardInfo = name => {
  const n = String(name ?? '').trim();
  return AWARDS.levels.concat(AWARDS.special).find(l => l.name === n) || null;
};
const isSpecialAward = name => AWARDS.special.some(l => l.name === String(name ?? '').trim());
const awardBudgetTotal = () =>
  AWARDS.levels.reduce((s, l) => s + l.quota * l.prize * AWARDS.groups.length, 0) +
  AWARDS.special.reduce((s, l) => s + l.quota * l.prize, 0);
// 各組各獎已配幾名、獎金加總、超額清單
function awardQuota(rows) {
  const count = {};
  let usedPrize = 0;
  (rows || []).forEach(r => {
    const a = String(r['擬獲獎項'] ?? '').trim();
    if (!a || a === '未獲獎') return;
    const g = pickVal(r, ['參賽組別','組別']) || '（未填組別）';
    const key = isSpecialAward(a) ? ('*||' + a) : (g + '||' + a);
    count[key] = (count[key] || 0) + 1;
    const info = awardInfo(a);
    if (info) usedPrize += info.prize;
  });
  const out = [], specials = [], overList = [], unknown = [];
  AWARDS.groups.forEach(g => {
    AWARDS.levels.forEach(l => {
      const used = count[g + '||' + l.name] || 0;
      const over = Math.max(0, used - l.quota);
      out.push({ group: g, level: l.name, used, quota: l.quota, prize: l.prize, over });
      if (over) overList.push(`${g} ${l.name} 超額 ${over}`);
    });
  });
  AWARDS.special.forEach(l => {
    const used = count['*||' + l.name] || 0;
    const over = Math.max(0, used - l.quota);
    specials.push({ level: l.name, used, quota: l.quota, prize: l.prize, over });
    if (over) overList.push(`${l.name} 超額 ${over}`);
  });
  Object.keys(count).forEach(k => {
    const [g, lv] = k.split('||');
    if (g !== '*' && !AWARDS.groups.includes(g)) unknown.push(`${g} ${lv}（${count[k]} 件）`);
  });
  return { rows: out, specials, overList, unknown, usedPrize, totalPrize: awardBudgetTotal() };
}

    if (row[k] !== undefined && String(row[k]).trim() !== '') return String(row[k]).trim();

  for (const k of keywords) {

}

function renderDocLinks(header, value) {
  const raw = String(value ?? '').trim();
  if (!raw) return '<div class="ro-display"><span class="doc-none">（未上傳）</span></div>';
  const urls = raw.split(/[\s,，、]+/).filter(u => /^https?:\/\//i.test(u));
  if (!urls.length) return `<div class="ro-display">${escapeHtml(raw)}</div>`;
  const isVideo = /影片|video|作品/.test(header);
  const label   = isVideo ? '▶ 看影片' : '📄 開啟';
  const cls     = isVideo ? 'doc-link video' : 'doc-link';
  const links = urls.map((u, i) =>
    `<a class="${cls}" href="${escapeHtml(u)}" target="_blank" rel="noopener" title="${escapeHtml(header)}">`
    + `${label}${urls.length > 1 ? ' ' + (i + 1) : ''}</a>`).join('');
  return `<div class="ro-display">${links}</div>`;
}
function escapeHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

  return [];
}

//  比喻：預算是「油箱容量」，開銷記錄是「已用掉的油」。
// ============================================================
let projectBudget = 1000000;
const fmtNT = n => 'NT$ ' + (Math.round(n) || 0).toLocaleString('zh-TW');
function loadBudget() {
  fetch(`${API_URL}?action=readBudget`, { redirect: 'follow' })
    .then(r => r.json())
    .then(res => {
      if (res && res.ok && res.budget > 0) {
        projectBudget = res.budget;
        const s = document.getElementById('budgetSlider');
        if (projectBudget > +s.max) s.max = String(projectBudget);
        s.value = String(projectBudget);
      }
      updateBudgetBar();
    })
    .catch(() => { updateBudgetBar(); });
}
function onBudgetSlide(v) {
  projectBudget = +v;
  updateBudgetBar();
}
let budgetSaveTimer;
function saveBudget(v) {
  projectBudget = +v;
  updateBudgetBar();
  clearTimeout(budgetSaveTimer);
  budgetSaveTimer = setTimeout(() => {
    fetch(API_URL, {
      method: 'POST', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'writeBudget', budget: projectBudget })
    })
    .then(r => r.json())
    .then(res => {
      if (res.ok) showToast('✓ 專案預算已儲存：' + fmtNT(projectBudget));
      else showToast('預算儲存失敗：' + (res.msg || ''), 'err');
    })
    .catch(err => showToast('預算儲存失敗：' + err.message, 'err'));
  }, 400);
}
function expenseSpent_() {
  const num = v => parseFloat(String(v ?? '0').replace(/,/g, '')) || 0;
  return (tableData['開銷記錄'] || []).reduce((s, r) => s + num(r['金額']), 0);
}
function updateBudgetBar() {
  const spent = expenseSpent_();
  const left  = projectBudget - spent;
  const pct   = projectBudget > 0 ? Math.round(spent / projectBudget * 100) : 0;
  document.getElementById('budgetAmount').textContent = fmtNT(projectBudget);
  const fill = document.getElementById('budgetFill');
  fill.style.width = Math.min(100, pct) + '%';
  fill.style.background = pct >= 100 ? 'var(--danger)' : pct >= 80 ? 'var(--warn)' : 'var(--accent)';
  const loaded  = loadedSheets.has('開銷記錄');
  const leftCol = left < 0 ? 'var(--danger)' : 'var(--success)';
  const pctCol  = pct >= 100 ? 'var(--danger)' : pct >= 80 ? 'var(--warn)' : 'var(--text)';
  document.getElementById('budgetStats').innerHTML = loaded
    ? `<span class="budget-stat"><span class="k">已花費</span><span class="v">${fmtNT(spent)}</span></span>` +
      `<span class="budget-stat"><span class="k">剩餘</span><span class="v" style="color:${leftCol}">${fmtNT(left)}${left < 0 ? ' ⚠️ 超支' : ''}</span></span>` +
      `<span class="budget-stat"><span class="k">使用率</span><span class="v" style="color:${pctCol}">${pct}%</span></span>`
    : `<span class="budget-stat"><span class="k">開銷資料載入中…</span></span>`;
}
function purchaseLinkBarHtml(rows) {
  if (!loadedSheets.has('開銷記錄')) {
    return '<div class="sum-item"><span class="sum-label">💡 錢帳勾稽</span><span class="sum-val">開銷記錄載入中…</span></div>';
  }
  const linked = new Set(
    (tableData['開銷記錄'] || [])
      .map(r => String(r['對應採購'] ?? '').trim())
      .filter(Boolean)
  );
  const missing = rows.filter(r => {
    const st = String(r['採購狀態'] ?? '').trim();
    if (st !== '已到貨' && st !== '已分發完畢') return false;
    return !linked.has(String(r['編號'] ?? '').trim());
  }).map(r => String(r['品項名稱'] || r['編號'] || '').replace(/</g, '&lt;'));
  if (!missing.length) {
    return '<div class="sum-item"><span class="sum-label">💡 錢帳勾稽</span>' +
           '<span class="sum-val" style="color:var(--success)">已到貨品項都已入帳（開銷記錄）✓</span></div>';
  }
  return '<div class="sum-item"><span class="sum-label">💡 還沒入帳（開銷記錄查無這些採購）</span>' +
         `<span class="sum-val" style="color:var(--warn)">${missing.join('、')}</span></div>`;
}
function distSums() {
  const toNum = v => parseFloat(String(v ?? '').replace(/,/g, '')) || 0;
  const used = {};
  (tableData['分發記錄'] || []).forEach(r => {
    const id = String(r['對應採購單號'] ?? '').trim();
    if (!id) return;
    used[id] = (used[id] || 0) + toNum(r['領用數量']);
  });
  return used;
}
function distBarInnerHtml() {
  const toNum = v => parseFloat(String(v ?? '').replace(/,/g, '')) || 0;
  const used  = distSums();
  if (!purchaseOptions.length) {
    return '<div class="sum-item"><span class="sum-label">採購造冊尚無品項</span></div>';
  }
  return purchaseOptions.map(o => {
    const total = toNum(o.qty);
    const u     = used[o.id] || 0;
    const left  = total - u;
    const col   = left < 0 ? 'var(--danger)' : (total && left === 0) ? 'var(--text-muted)' : 'var(--success)';
    const name  = String(o.item || o.id).replace(/</g, '&lt;');
    return `<div class="sum-item"><span class="sum-label">${name}</span>` +
           `<span class="sum-val">已領 ${u}${total ? '／' + total : ''}</span>` +
           `<span class="sum-val" style="color:${col}">剩 ${left}${left < 0 ? ' ⚠️' : ''}</span></div>`;
  }).join('');
}
function updateDistBar() {
  const bar = document.getElementById('distBar');
  if (bar) bar.innerHTML = distBarInnerHtml();
}
// ★ v24 徵件作品：底部審查進度統計列
function subBarInnerHtml(rows) {
  const total   = rows.length;
  const pending = rows.filter(r => subIsPending(r['審查狀態'])).length;
  const passed  = rows.filter(r => String(r['審查狀態'] ?? '').trim() === '資格通過').length;
  const missing = rows.filter(r => missingOf(r).length).length;
  const awarded = rows.filter(r => subIsAwarded(r['擬獲獎項'])).length;
  const pct     = total ? Math.round((total - pending) / total * 100) : 0;
  return `
    <div class="sum-item"><span class="sum-label">收件</span><span class="sum-val total">${total} 件</span></div>
    <div class="sum-item"><span class="sum-label">待審</span><span class="sum-val" style="color:${pending ? 'var(--warn)' : 'var(--success)'}">${pending} 件</span></div>
    <div class="sum-item"><span class="sum-label">資格通過</span><span class="sum-val" style="color:var(--success)">${passed} 件</span></div>
    <div class="sum-item"><span class="sum-label">文件不齊</span><span class="sum-val" style="color:${missing ? 'var(--danger)' : 'var(--success)'}">${missing} 件</span></div>
    <div class="sum-item"><span class="sum-label">審查進度</span><span class="sum-val">${pct}%</span></div>
    ${awarded ? `<div class="sum-item"><span class="sum-label">🏆 擬獲獎</span><span class="sum-val" style="color:#b45309">${awarded} 件</span></div>` : ''}`;
}
// ★ v26 獎項配額看板：每組每獎已配幾名、獎金加總
function awardBarInnerHtml(rows) {
  const q = awardQuota(rows);
  const total = q.rows.reduce((n, r) => n + r.used, 0) + q.specials.reduce((n, r) => n + r.used, 0);
  if (!total) {
    return `<div class="sum-item"><span class="sum-label">🏆 獎項配額</span>` +
           `<span class="sum-val" style="color:var(--text-muted)">評審定案後在「擬獲獎項」選獎，這裡會即時顯示名額與獎金</span></div>`;
  }
  const fmt = n => 'NT$ ' + n.toLocaleString('zh-TW');
  const grpHtml = AWARDS.groups.map(g => {
    const parts = q.rows.filter(r => r.group === g).map(r => {
      const col = r.over ? 'var(--danger)' : (r.used === r.quota ? 'var(--success)' : 'var(--text-dim)');
      return `<span style="color:${col}">${r.level} ${r.used}/${r.quota}${r.over ? ' ⚠️' : ''}</span>`;
    }).join('　');
    return `<div class="sum-item"><span class="sum-label">${g}</span><span class="sum-val">${parts}</span></div>`;
  }).join('');
  const spHtml = q.specials.map(sp => {
    const col = sp.over ? 'var(--danger)' : (sp.used === sp.quota ? 'var(--success)' : 'var(--text-dim)');
    return `<div class="sum-item"><span class="sum-label">${sp.level}</span>` +
           `<span class="sum-val" style="color:${col}">${sp.used}/${sp.quota}${sp.over ? ' ⚠️' : ''}</span></div>`;
  }).join('');
  const overCol = q.usedPrize > q.totalPrize ? 'var(--danger)' : '#b45309';
  const warn = q.overList.length
    ? `<div class="sum-item"><span class="sum-label" style="color:var(--danger)">🔴 超額</span><span class="sum-val" style="color:var(--danger)">${q.overList.join('、')}</span></div>` : '';
  const unk = q.unknown.length
    ? `<div class="sum-item"><span class="sum-label" style="color:var(--warn)">⚠️ 組別對不上設定</span><span class="sum-val" style="color:var(--warn)">${q.unknown.join('、')}</span></div>` : '';
  return grpHtml + spHtml +
    `<div class="sum-item"><span class="sum-label">🏆 獎金已配</span>` +
    `<span class="sum-val" style="color:${overCol}">${fmt(q.usedPrize)} / ${fmt(q.totalPrize)}</span></div>` +
    warn + unk;
}
function updateAwardBar() {
  const bar = document.getElementById('awardBar');
  if (bar) bar.innerHTML = awardBarInnerHtml(tableData[currentSheet] || []);
}
function updateSubBar() {
  const bar = document.getElementById('subBar');
  if (bar) bar.innerHTML = subBarInnerHtml(tableData[currentSheet] || []);
}
function syncDistributedToPurchase() {
  ensurePurchaseOptions().then(() => {
    const used = distSums();
    const rows = tableData['採購造冊'] || [];
    const updates = [];
    rows.forEach(r => {
      const id = String(r['編號'] ?? '').trim();
      if (!id || used[id] === undefined) return;
      if (String(r['已分發數'] ?? '').trim() !== String(used[id])) {
        r['已分發數'] = String(used[id]);
        updates.push({ '編號': id, '已分發數': String(used[id]) });
      }
    });
    if (!updates.length) return;
    fetch(API_URL, {
      method: 'POST', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'writeRoster', sheet: '採購造冊', data: { updates: updates, deletes: [] } })
    })
    .then(r => r.json())
    .then(res => { if (res.ok) showToast(`✓ 已把 ${updates.length} 個品項的「已分發數」同步回採購造冊`); })
    .catch(() => {});
  });
}
window.addEventListener('DOMContentLoaded', () => {
  buildTabs();
  switchTab(SHEET_NAMES[0]);
  loadBudget();
  ensureExpense().then(() => updateBudgetBar());
});
function buildTabs() {
  const bar = document.getElementById('tabsBar');
  SHEET_NAMES.forEach(name => {
    const div = document.createElement('div');
    div.className = 'tab';
    div.id = 'tab-' + name;
    div.style.setProperty('--tab-color', SHEETS[name].color);
    div.innerHTML = `${name}<span class="cnt" id="cnt-${name}">0</span>`;
    div.onclick = () => switchTab(name);
    bar.appendChild(div);
  });
}
function switchTab(name) {
  currentSheet = name;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  const tab = document.getElementById('tab-' + name);
  tab.classList.add('active');
  tab.style.setProperty('--tab-color', SHEETS[name].color);
  document.getElementById('colorBar').style.background = SHEETS[name].color;
  document.getElementById('searchInput').value = '';
  trainingBatchFilter = '';
  trainingUnconfirmedOnly = false;
  trainingCompactView = true;
  subStatusFilter = '';
  subPendingOnly  = false;
  subMissingOnly  = false;
  subCompactView  = true;
  const config = SHEETS[name];
  const isExternalSheet = !!config.saveAction;
  document.getElementById('addRowBtn').style.display = isExternalSheet ? 'none' : '';
  const wb = document.getElementById('toWinnerBtn');
  if (wb) wb.style.display = config.isSubmission ? '' : 'none';
  const existingHint = document.getElementById('schoolHint');
  if (existingHint) existingHint.remove();
  if (config.isSubmission) {
    const hint = document.createElement('span');
    hint.id = 'schoolHint';
    hint.className = 'school-hint';
    hint.innerHTML = '🎬 點文件按鈕看影片與證件 → 選「審查狀態」→ 按「✓ 儲存」｜評審定案後填「擬獲獎項」，再按「🏆 轉入得獎者」';
    document.getElementById('toolbar').appendChild(hint);
  } else if (isExternalSheet) {
    const hint = document.createElement('span');
    hint.id = 'schoolHint';
    hint.className = 'school-hint';
    if (config.dynamicHeaders && config.editable) {
      hint.innerHTML = `✏️ 僅以下欄位可編輯：${config.editable.join('、')}`;
    } else if (config.dynamicHeaders) {
      hint.innerHTML = '✏️ 欄位可直接編輯（編號除外），儲存後同步回 Sheets；在 Sheet 加新欄會自動出現';
    } else {
      hint.innerHTML = '✏️ 欄位可直接編輯，儲存後同步回 Sheets';
    }
    document.getElementById('toolbar').appendChild(hint);
  } else if (config.distLog) {
    const hint = document.createElement('span');
    hint.id = 'schoolHint';
    hint.className = 'school-hint';
    hint.innerHTML = '📦 每領一次記一筆；選「對應採購單號」自動帶品項，存檔後自動回寫採購造冊的已分發數';
    document.getElementById('toolbar').appendChild(hint);
  } else if (name === '開銷記錄') {
    const hint = document.createElement('span');
    hint.id = 'schoolHint';
    hint.className = 'school-hint';
    hint.innerHTML = '🧾 所有花費都記這裡；買採購造冊的東西→「對應採購」選品項（自動帶金額與說明），純執行費用留「—」';
    document.getElementById('toolbar').appendChild(hint);
  }
  if (!loadedSheets.has(name)) {
    loadCurrentSheet();
  } else if (config.needsPurchase) {
    ensurePurchaseOptions().then(() => renderTable());
  } else if (name === '採購造冊') {
    Promise.all([ensureDistLog(), ensureExpense()]).then(() => renderTable());
  } else {
    renderTable();
  }
}
// silent = true 時不蓋掉畫面（儲存後的背景重讀用，資料一直看得到）
function loadCurrentSheet(silent) {
  const name   = currentSheet;
  const config = SHEETS[name];
  const url    = config.sourceAction
    ? `${API_URL}?action=${config.sourceAction}`
    : `${API_URL}?action=readRoster&sheet=${encodeURIComponent(name)}`;
  if (!silent) setTableLoading();
  setSyncState('loading', silent ? '背景更新中…' : '連線中…');
  loadBudget();
  fetch(url, { redirect: 'follow' })
    .then(r => r.json())
    .then(res => {
      if (!res.ok) throw new Error(res.msg || '讀取失敗');
      tableData[name] = res.data || [];
      if (config.dynamicHeaders) {
        if (res.headers) {
          let hs = res.headers.slice();
          if (config.compactFields) {
            // 把重點欄照順序搬到最前面（關鍵字模糊比對），其餘照原順序跟在後面
            const pri  = resolveCompactHeaders(config.compactFields, hs);
            const rest = hs.filter(h => !pri.includes(h));
            hs = pri.concat(rest);
          } else {
            const ci = hs.indexOf('確認出席');
            if (ci > -1) {
              hs.splice(ci, 1);
              const ni = hs.indexOf('姓名');
              hs.splice(ni > -1 ? ni + 1 : 0, 0, '確認出席');
            }
          }
          config.headers = hs;
        }
        if (res.editable) config.editable = res.editable;
      }
      loadedSheets.add(name);
      updateCount(name);
      setSyncState('ok', `最後同步：${fmtTime()}`);
      if (config.needsPurchase) {
        ensurePurchaseOptions().then(() => renderTable());
      } else if (name === '採購造冊') {
        Promise.all([ensureDistLog(), ensureExpense()]).then(() => renderTable());
      } else {
        renderTable();
      }
    })
    .catch(err => {
      if (!silent) {
        document.getElementById('tableArea').innerHTML =
          `<div class="loading" style="color:var(--danger)">讀取失敗：${err.message}</div>`;
      }
      setSyncState('err', '連線失敗：' + err.message);
      showToast('讀取失敗：' + err.message, 'err');
    });
}
function saveCurrentSheet() {
  const name   = currentSheet;
  const config = SHEETS[name];
  const all    = tableData[name] || [];
  const btn    = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = '儲存中…';
  const dset      = dirtyKeys[name] || new Set();
  const dirtyRows = all.filter(r => dset.has(rowKeyOf(name, r)));
  const deletes   = Array.from(deletedKeys[name] || new Set());
  if (!dirtyRows.length && !deletes.length) {
    btn.disabled = false; btn.textContent = '✓ 儲存';
    showToast('沒有變更需要儲存');
    return;
  }
  let body;
  if (config.saveAction) {
    let payload = dirtyRows;
    if (config.dynamicHeaders && config.editable) {
      // 只送可編輯欄位＋穩定鍵（表單原始資料一個字都不動）
      payload = dirtyRows.map(row => {
        const out = { _rowIndex: row._rowIndex, _key: row._key };
        config.editable.forEach(f => { out[f] = row[f] !== undefined ? row[f] : ''; });
        // ★ v24 徵件：缺件由系統自動算，順便寫回 Sheet，讓直接看 Sheet 的人也一目了然
        if (config.isSubmission) {
          const miss = missingOf(row);
          out['缺件項目'] = miss.length ? miss.join('、') : '齊全';
        }
        return out;
      });
    }
    body = JSON.stringify({ action: config.saveAction, data: payload });
  } else {
    body = JSON.stringify({ action: 'writeRoster', sheet: name, data: { updates: dirtyRows, deletes } });
  }
  fetch(API_URL, {
    method: 'POST', redirect: 'follow',
    headers: { 'Content-Type': 'text/plain' },
    body
  })
  .then(r => r.json())
  .then(res => {
    if (!res.ok) throw new Error(res.msg || '儲存失敗');
    showToast(`✓「${name}」已同步（送出 ${dirtyRows.length} 筆變更${deletes.length?`、刪除 ${deletes.length} 筆`:''}）`);
    setSyncState('ok', `最後儲存：${fmtTime()}`);
    dirtyKeys[name]   = new Set();
    deletedKeys[name] = new Set();
    isDirty = false;
    if (config.distLog) syncDistributedToPurchase();
    // 背景重讀（看得到同事的更新），但不蓋掉畫面
    loadedSheets.delete(name);
    loadCurrentSheet(true);
  })
  .catch(err => showToast('儲存失敗：' + err.message, 'err'))
  .finally(() => { btn.disabled = false; btn.textContent = '✓ 儲存'; });
}
function renderTable() {
  const name    = currentSheet;
  const config  = SHEETS[name];
  const allData = tableData[name] || [];
  const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
  const isExternalSheet = !!config.saveAction;
  buildPurchaseOptions();
  const fullHeaders = config.headers || [];
  // 精簡模式：培訓＝電訪模式、徵件＝審查模式
  const compactOn = !!config.compactFields &&
                    (config.isSubmission ? subCompactView : trainingCompactView);
  let headers = compactOn
    ? resolveCompactHeaders(config.compactFields, fullHeaders)
    : fullHeaders;
  if (!config.dynamicHeaders) headers = headers.filter(h => h !== '編號');
  const stickyCol = (!compactOn && config.stickyCol && headers.includes(config.stickyCol)) ? config.stickyCol : null;
  syncFilters();
  let filtered = keyword
    ? allData.filter(row => fullHeaders.some(h => String(row[h] ?? '').toLowerCase().includes(keyword)))
    : allData;
  let extraFilter = false;
  // ── 培訓學員：梯次、只看待電訪 ──
  if (config.isTraining && fullHeaders.includes(TRAINING_BATCH_FIELD)) {
    if (trainingBatchFilter) {
      extraFilter = true;
      filtered = filtered.filter(r => {
        const v = String(r[TRAINING_BATCH_FIELD] ?? '').trim();
        return trainingBatchFilter === '__blank__' ? v === '' : v === trainingBatchFilter;
      });
    }
    if (trainingUnconfirmedOnly) {
      extraFilter = true;
      filtered = filtered.filter(r => trainingNeedsCall(r['確認出席']));
    }
  }
  // ── ★ v24 徵件作品：審查狀態、只看待審、只看缺件 ──
  if (config.isSubmission) {
    if (subStatusFilter) {
      extraFilter = true;
      filtered = filtered.filter(r => {
        const v = String(r['審查狀態'] ?? '').trim();
        return subStatusFilter === '__blank__' ? v === '' : v === subStatusFilter;
      });
    }
    if (subPendingOnly) {
      extraFilter = true;
      filtered = filtered.filter(r => subIsPending(r['審查狀態']));
    }
    if (subMissingOnly) {
      extraFilter = true;
      filtered = filtered.filter(r => missingOf(r).length > 0);
    }
    // 待審的排前面（要處理的先看到），同狀態依收件時間由早到晚
    filtered = filtered.slice().sort((a, b) => {
      const pa = subIsPending(a['審查狀態']) ? 0 : 1;
      const pb = subIsPending(b['審查狀態']) ? 0 : 1;
      if (pa !== pb) return pa - pb;
      return String(a._key || '').localeCompare(String(b._key || ''));
    });
  }
  // 有「日期」欄的內部名單依日期排序（只排畫面，資料不動）
  if (!config.dynamicHeaders && fullHeaders.includes('日期')) {
    filtered = filtered.slice().sort((a, b) => {
      const da = toISODate(a['日期']) || '9999-12-31';
      const db = toISODate(b['日期']) || '9999-12-31';
      if (da !== db) return da < db ? -1 : 1;
      return (parseInt(a['編號']) || 0) - (parseInt(b['編號']) || 0);
    });
  }

function parseMD(s) {
  const t = String(s || '').trim();
  let m = t.match(/(\d{1,2})\s*月\s*(\d{1,2})/);
  if (m) return { mo: +m[1], dy: +m[2] };
  m = t.match(/(?:^|[^0-9])(\d{1,2})[\/\-.](\d{1,2})(?![0-9])/);
  if (m) return { mo: +m[1], dy: +m[2] };
  return null;
}
function computeSums(allData, config) {
  const num = v => parseFloat(String(v ?? '0').replace(/,/g, '')) || 0;
  const total   = allData.reduce((s, r) => s + num(r[config.amountCol]), 0);
  const pending = allData.filter(r => r['付款狀態'] === '待申請')
                         .reduce((s, r) => s + num(r[config.amountCol]), 0);
  const applied = allData.filter(r => r['付款狀態'] === '已申請')
                         .reduce((s, r) => s + num(r[config.amountCol]), 0);
  return { total, pending, applied };
}

    <div class="sum-item"><span class="sum-label">已申請</span><span class="sum-val" style="color:var(--success)">${fmt(applied)}</span></div>`;
}

const MONEY_FIELDS = new Set(['報價','出席費','金額','單價','預估總額','實際支出']);
function toISODate(raw) {
  const p2 = n => String(n).padStart(2, '0');
  const s = String(raw ?? '').trim();
  if (!s) return '';
  if (/T/.test(s) || /Z$/i.test(s) || /\d{1,2}:\d{2}/.test(s)) {
    const dt = new Date(s);
    if (!isNaN(dt.getTime())) {
      let y = dt.getFullYear();
      if (y < 1912) y += 1911;
      return `${y}-${p2(dt.getMonth() + 1)}-${p2(dt.getDate())}`;
    }
  }
  let y, mo, d;
  const m = s.match(/(\d{1,4})\D+(\d{1,2})\D+(\d{1,2})/);
  if (m) {
    y = +m[1]; mo = +m[2]; d = +m[3];
  } else {
    const dg = s.replace(/\D/g, '');
    if (dg.length === 8)      { y = +dg.slice(0,4); mo = +dg.slice(4,6); d = +dg.slice(6,8); }
    else if (dg.length === 7) { y = +dg.slice(0,3); mo = +dg.slice(3,5); d = +dg.slice(5,7); }
    else return '';
  }
  if (!y || !mo || !d || mo > 12 || d > 31) return '';
  if (y < 1912) y += 1911;
  return `${y}-${p2(mo)}-${p2(d)}`;
}
function isMinorLocal(birthRaw) {
  const iso = toISODate(birthRaw);
  if (!iso) return null;
  const b = new Date(iso + 'T00:00:00');
  if (isNaN(b.getTime())) return null;
  const today = new Date();
  if (b.getTime() > today.getTime()) return false;
  let age = today.getFullYear() - b.getFullYear();
  const md = today.getMonth() - b.getMonth();
  if (md < 0 || (md === 0 && today.getDate() < b.getDate())) age--;
  if (age < 6) return false;
  return age < 18;
}

    const cur = String(value ?? '').trim();
    const q   = awardQuota(tableData['徵件作品'] || []);
    const grp = pickVal(row || {}, ['參賽組別','組別']);
    // 這一格目前的獎項有沒有超額
    const myOver = (() => {
      if (!cur || cur === '未獲獎') return false;
      if (isSpecialAward(cur)) return (q.specials.find(x => x.level === cur) || {}).over > 0;
      return (q.rows.find(x => x.group === grp && x.level === cur) || {}).over > 0;
    })();
    const col = myOver ? 'var(--danger)'
              : cur === '首獎'   ? '#b45309'
              : cur === '優選'   ? '#0369a1'
              : cur === '佳作'   ? '#059669'
              : cur === '社大獎' ? '#7c3aed'
              : cur === '未獲獎' ? 'var(--text-muted)'
              : 'var(--text-muted)';
    let optList = SUB_AWARD_OPTIONS.slice();
    if (cur && !optList.includes(cur)) optList = [cur, ...optList];
    const opts = optList.map(o => {
      const info = awardInfo(o);
      let tag = '';
      if (info) {
        const st = isSpecialAward(o)
          ? q.specials.find(x => x.level === o)
          : q.rows.find(x => x.group === grp && x.level === o);
        const used = st ? st.used : 0;
        tag = ` (${used}/${info.quota}·${(info.prize / 1000)}K)`;
      }
      return `<option value="${o}"${o === cur ? ' selected' : ''}>${o}${tag}</option>`;
    }).join('');
    return `<select style="color:${col};font-weight:${subIsAwarded(cur) ? '700' : '400'}" `
      + `title="括號是「已配名額/上限·獎金千元」" `
      + `onchange="updateCell(${rowIndex},'${header}',this.value)">`
      + `<option value=""${cur ? '' : ' selected'}>（未定）</option>${opts}</select>`;
  }
  // 培訓學員「確認出席」→ 電訪結果下拉；其他名單 → 打勾框
  if (header === '確認出席') {
    if (config.dynamicHeaders && config.editable) {
      const cur = String(value ?? '').trim();
      const col = cur === '會來' ? 'var(--success)'
                : cur === '取消' ? 'var(--danger)'
                : cur ? 'var(--warn)' : 'var(--text-muted)';
      let optList = TRAINING_CALL_OPTIONS.slice();
      if (cur && !optList.includes(cur)) optList = [cur, ...optList];
      const opts = optList.map(o => `<option value="${o}"${o === cur ? ' selected' : ''}>${o}</option>`).join('');
      return `<select style="color:${col};font-weight:${cur ? '700' : '400'}" `
        + `onchange="updateCell(${rowIndex},'${header}',this.value)">`
        + `<option value=""${cur ? '' : ' selected'}>（未電訪）</option>${opts}</select>`;
    }
    const yes = String(value ?? '').trim() !== '';
    return `<label class="confirm-box">`
      + `<input type="checkbox" ${yes ? 'checked' : ''} `
      + `onchange="updateCell(${rowIndex},'${header}',this.checked?'會來':'')">`
      + `<span>會來</span></label>`;
  }
  if (header === '已通知') {
    const yes = String(value ?? '').trim() !== '';
    return `<label class="confirm-box">`
      + `<input type="checkbox" ${yes ? 'checked' : ''} `
      + `onchange="updateCell(${rowIndex},'${header}',this.checked?'已通知':'')">`
      + `<span>已通知</span></label>`;
  }
  if (header === '對應採購單號' || header === '對應採購') {
    const cur = String(value ?? '').trim();
    let opts = (header === '對應採購')
      ? '<option value="">—</option>'
      : '<option value=""></option>';
    const known = purchaseOptions.some(o => o.id === cur);
    if (cur && !known) {
      opts += `<option value="${cur.replace(/"/g,'&quot;')}" selected>${cur}（採購名冊已無此編號）</option>`;
    }
    opts += purchaseOptions.map(o => {
      const lbl = escapeHtml(o.label);
      const idv = String(o.id).replace(/"/g,'&quot;');
      return `<option value="${idv}"${o.id===cur?' selected':''}>${lbl}</option>`;
    }).join('');
    const selCol = cur ? 'var(--accent)' : 'var(--text-muted)';
    return `<select style="color:${selCol};font-weight:${cur ? '700' : '400'}" onchange="updateCell(${rowIndex},'${header}',this.value)">${opts}</select>`;
  }
  const dd = config.dropdowns?.[header];
  if (dd) {
    const optList = (value && !dd.includes(value)) ? [value, ...dd] : dd;
    const opts = optList.map(o => `<option value="${o}"${o===value?' selected':''}>${o}</option>`).join('');
    return `<select onchange="updateCell(${rowIndex},'${header}',this.value)"><option value=""></option>${opts}</select>`;
  }
  // 多行文字格（地址、備註、項目說明、審查備註）
  const isAddr = (header === '地址' || header === '通訊地址' || header === '備註'
               || header === '項目說明' || header === '審查備註');
  if (isAddr) {
    const ph = header === '審查備註' ? '例：已電話通知，8/25 前補件' : '';
    return `<div class="addr-edit" contenteditable="true" data-ph="${ph}"
      onblur="updateCell(${rowIndex},'${header}',this.innerText.trim())"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();this.blur()}"
      >${safe}</div>`;
  }
  if (DATE_COLS.has(header)) {
    const iso = toISODate(value);
    return `<input type="date" class="date-input" value="${iso}"
      onchange="updateCell(${rowIndex},'${header}',this.value)"
      title="點一下選日期；留白代表尚未填寫">`;
  }
  const inputSafe = String(value ?? '').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  const numAttr = (MONEY_FIELDS.has(header) || header === '領用數量') ? ' inputmode="decimal"' : '';
  return `<input type="text"${numAttr} value="${inputSafe}" oninput="updateCell(${rowIndex},'${header}',this.value)" placeholder="${header}">`;
}
function updateCell(rowIndex, header, value) {
  if (!tableData[currentSheet]) return;
  const row = tableData[currentSheet][rowIndex];
  row[header] = value;
  markRowDirty(currentSheet, rowKeyOf(currentSheet, row));
  updateCount(currentSheet);
  const cfg = SHEETS[currentSheet];
  // ★ v24 徵件作品：改了審查狀態 → 只更新底部統計與篩選器計數，不重畫整表
  //   （重畫會讓表格跳動、也會打斷連續審查的節奏）
  if (cfg.isSubmission && (header === '審查狀態' || header === '擬獲獎項')) {
    updateSubBar();
    if (header === '擬獲獎項') {
      updateAwardBar();
      // 超額立刻提醒（不阻止，因為可能是並列或臨時加碼）
      const q = awardQuota(tableData[currentSheet] || []);
      const a = String(value ?? '').trim();
      if (a && a !== '未獲獎') {
        const grp = pickVal(row, ['參賽組別','組別']);
        const st = isSpecialAward(a)
          ? q.specials.find(x => x.level === a)
          : q.rows.find(x => x.group === grp && x.level === a);
        if (st && st.over > 0) {
          showToast(`⚠️ ${isSpecialAward(a) ? a : grp + ' ' + a} 已超額 ${st.over} 名（上限 ${st.quota}）`, 'err');
        } else {
          const info = awardInfo(a);
          if (info && st) showToast(`${a}　${st.used}/${st.quota} 名　獎金 NT$ ${info.prize.toLocaleString('zh-TW')}`);
        }
      }
      renderTable();   // 重畫讓其他列的「剩餘名額」跟著更新
    } else {
      syncFilters();
    }
    return;
  }
  if (cfg.isTraining && header === '確認出席') {
    renderTable();
    return;
  }
  if (currentSheet === '開銷記錄' && header === '對應採購') {
    const hit = purchaseOptions.find(o => o.id === String(value).trim());
    if (hit) {
      const curAmt = parseFloat(String(row['金額'] ?? '').replace(/,/g, '')) || 0;
      const filledAmt = (!curAmt && hit.amt);
      if (filledAmt) row['金額'] = String(hit.amt);
      if (!String(row['項目說明'] ?? '').trim() && hit.item) row['項目說明'] = '採購｜' + hit.item;
      showToast('✓ 已串接採購「' + hit.item + '」' + (filledAmt ? '，帶入金額 ' + hit.amt.toLocaleString('zh-TW') + '（可修改）' : ''));
    }
    renderTable();
    updateSumBar();
    updateBudgetBar();
    return;
  }
  if (cfg.distLog && header === '對應採購單號') {
    const hit = purchaseOptions.find(o => o.id === String(value).trim());
    row['品項名稱'] = hit ? hit.item : '';
    renderTable();
    return;
  }
  if (cfg.distLog && header === '領用數量') updateDistBar();
  if (cfg.amountCol === header || header === '付款狀態') {
    updateSumBar();
    updateBudgetBar();
  }
}
// ============================================================
//  ★ v25 得獎配對：徵件作品 → 得獎者名單
//
//  為什麼要做這個：
//   得獎名單要寄獎狀、匯獎金，作品名、姓名、電話、Email 全都要正確。
//   十幾筆手打，錯一個電話就聯絡不到人。這一支負責把資料原封搬過去。
//
//  規則：
//   ・只搬「擬獲獎項」有填、而且不是「未獲獎」的作品
//   ・用「作品名稱」比對，同一件重複轉入只會更新獎項，不會產生重複列
//   ・得獎者名單裡已經人工填好的欄位（通訊地址、出席確認…）不會被覆蓋
// ============================================================
function ensureWinners() {
  if (loadedSheets.has('得獎者')) return Promise.resolve();
  return fetch(`${API_URL}?action=readRoster&sheet=${encodeURIComponent('得獎者')}`, { redirect: 'follow' })
    .then(r => r.json())
    .then(res => {
      if (res && res.ok) {
        tableData['得獎者'] = res.data || [];
        loadedSheets.add('得獎者');
        updateCount('得獎者');
      }
    })
    .catch(() => {});
}

function convertToWinners() {
  if (isDirty) {
    showToast('請先按「✓ 儲存」，再執行轉入', 'err');
    return;
  }
  const subs = tableData['徵件作品'] || [];
  const awarded = subs.filter(r => subIsAwarded(r['擬獲獎項']));
  if (!awarded.length) {
    showToast('目前沒有作品填了「擬獲獎項」', 'err');
    return;
  }

  const btn = document.getElementById('toWinnerBtn');
  btn.disabled = true; btn.textContent = '轉入中…';

  ensureWinners().then(() => {
    const winners = tableData['得獎者'] || [];
    const byTitle = {};
    winners.forEach(w => {
      const t = String(w['作品名稱'] ?? '').trim();
      if (t) byTitle[t] = w;
    });

    let maxNo = winners.reduce((m, w) => Math.max(m, parseInt(w['編號']) || 0), 0);
    const updates = [];
    let added = 0, updated = 0, skipped = 0;

    awarded.forEach(r => {
      const title = String(r['作品名稱'] ?? '').trim() || '（未填作品名）';
      const award = String(r['擬獲獎項'] ?? '').trim();
      const exist = byTitle[title];

      if (exist) {
        // 已在得獎名單：只更新獎項與對應獎金，其他人工填好的欄位完全不動
        if (String(exist['獎項'] ?? '').trim() === award) { skipped++; return; }
        const inf = awardInfo(award);
        exist['獎項'] = award;
        if (inf) exist['獎金'] = String(inf.prize);
        updates.push({
          '編號': String(exist['編號'] ?? '').trim(),
          '獎項': award,
          '獎金': inf ? String(inf.prize) : ''
        });
        updated++;
        return;
      }

      maxNo++;
      const info = awardInfo(award);
      const row = {
        '編號':         String(maxNo),
        '獎項':         award,
        '組別':         pickVal(r, ['參賽組別','組別']),
        '作品名稱':     title,
        '得獎者姓名':   pickVal(r, ['參賽姓名','姓名']),
        '團隊名稱':     pickVal(r, ['參賽團體名稱','團體','團隊']),
        '獎金':         info ? String(info.prize) : '',
        '電話':         pickVal(r, ['聯絡者電話','電話','手機']),
        'Email':        pickVal(r, ['聯絡者電子信箱','電子信箱','Email','信箱']),
        '通訊地址':     '',
        '出席確認':     '待確認',
        '獎金匯款狀態': '待匯款',
        '備註':         '由徵件作品轉入'
      };
      winners.push(row);
      byTitle[title] = row;
      updates.push(row);
      added++;
    });

    if (!updates.length) {
      showToast(`得獎者名單已是最新（${skipped} 件已存在且獎項相同）`);
      btn.disabled = false; btn.textContent = '🏆 轉入得獎者';
      return;
    }

    const q = awardQuota(subs);
    const fmtA = n => 'NT$ ' + n.toLocaleString('zh-TW');
    let msg = `即將轉入得獎者名單：\n\n  新增 ${added} 件\n  更新獎項 ${updated} 件`;
    if (skipped) msg += `\n  已存在不變 ${skipped} 件`;
    msg += `\n\n獎金合計 ${fmtA(q.usedPrize)} ／ 預算 ${fmtA(q.totalPrize)}`;
    if (q.overList.length) msg += `\n\n🔴 名額超額：${q.overList.join('、')}\n（仍可轉入，請確認是否為並列或加碼）`;
    msg += `\n\n⚠️ 通訊地址徵件表沒有收，要另外聯絡取得（寄獎狀、匯獎金用）。\n\n確定執行？`;
    if (!confirm(msg)) {
      btn.disabled = false; btn.textContent = '🏆 轉入得獎者';
      return;
    }

    fetch(API_URL, {
      method: 'POST', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'writeRoster', sheet: '得獎者', data: { updates: updates, deletes: [] } })
    })
    .then(r => r.json())
    .then(res => {
      if (!res.ok) throw new Error(res.msg || '轉入失敗');
      showToast(`✓ 已轉入得獎者名單（新增 ${added} 件、更新 ${updated} 件）`);
      loadedSheets.delete('得獎者');
      updateCount('得獎者');
      setTimeout(() => switchTab('得獎者'), 600);   // 切過去讓你確認結果
    })
    .catch(err => showToast('轉入失敗：' + err.message, 'err'))
    .finally(() => { btn.disabled = false; btn.textContent = '🏆 轉入得獎者'; });
  });
}

function addRow() {
  if (!tableData[currentSheet]) tableData[currentSheet] = [];
  const cfg = SHEETS[currentSheet];
  const newRow = {};
  (cfg.headers || []).forEach(h => { newRow[h] = ''; });
  if ((cfg.headers || []).includes('編號')) {
    const maxNo = (tableData[currentSheet] || []).reduce((m, r) => Math.max(m, parseInt(r['編號']) || 0), 0);
    newRow['編號'] = String(maxNo + 1);
  }
  if (cfg.distLog && newRow['日期'] !== undefined) {
    const n = new Date();
    newRow['日期'] = `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, '0')}-${String(n.getDate()).padStart(2, '0')}`;
  }
  tableData[currentSheet].push(newRow);
  markRowDirty(currentSheet, rowKeyOf(currentSheet, newRow));
  updateCount(currentSheet);
  renderTable();
  setTimeout(() => {
    const rows = document.querySelectorAll('#tableArea tbody tr');
    if (rows.length) {
      const last = rows[rows.length - 1];
      last.scrollIntoView({ behavior: 'smooth', block: 'center' });
      const first = last.querySelector('input, select');
      if (first) first.focus();
    }
  }, 60);
}
function deleteRow(rowIndex) {
  if (!confirm('確定刪除這一列？')) return;
  const row = tableData[currentSheet][rowIndex];
  const key = String(row['編號'] || '').trim();
  if (key) {
    (deletedKeys[currentSheet] = deletedKeys[currentSheet] || new Set()).add(key);
    if (dirtyKeys[currentSheet]) dirtyKeys[currentSheet].delete(key);
  }
  tableData[currentSheet].splice(rowIndex, 1);
  isDirty = true;
  updateCount(currentSheet);
  renderTable();
}
function updateCount(name) {
  const el = document.getElementById('cnt-' + name);
  if (el) el.textContent = (tableData[name] || []).length;
  const info = document.getElementById('rowInfo');
  if (info && name === currentSheet) {
    const cfg = SHEETS[name];
    const rows = tableData[name] || [];
    if (cfg && cfg.isSubmission) {
      const pending = rows.filter(r => subIsPending(r['審查狀態'])).length;
      info.textContent = `${rows.length} 件 · 待審 ${pending}`;
    } else {
      info.textContent = `${rows.length} 筆`;
    }
  }
  if (name === '開銷記錄') updateBudgetBar();
}
function setTableLoading() {
  document.getElementById('tableArea').innerHTML =
    '<div class="loading"><div class="spinner"></div>從 Google Sheets 讀取中…</div>';
}
function setSyncState(state, text) {
  const dot   = document.getElementById('syncDot');
  const label = document.getElementById('syncLabel');
  const info  = document.getElementById('syncText');
  dot.className = 'sync-dot' + (state==='ok'?' ok':state==='err'?' err':'');
  if (info)  info.textContent  = text;
  if (label) label.textContent = state==='ok' ? fmtTime()+' 已同步' : state==='err' ? '連線異常' : '…';
}
let toastTimer;
function showToast(msg, type='ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (type==='err' ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, 3500);
}
function fmtTime() {
  const n = new Date();
  return `${n.getHours().toString().padStart(2,'0')}:${n.getMinutes().toString().padStart(2,'0')}`;
}
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveCurrentSheet(); }
});
window.addEventListener('beforeunload', e => { if (isDirty) { e.preventDefault(); e.returnValue = ''; } });
</script>
